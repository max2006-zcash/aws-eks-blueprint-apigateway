apiVersion: v1
kind: ServiceAccount
metadata:
  name: oneuptime-sensor-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneuptime-job-creator
  namespace: argo-events
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneuptime-job-creator
  namespace: argo-events
subjects:
  - kind: ServiceAccount
    name: oneuptime-sensor-sa
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oneuptime-job-creator
