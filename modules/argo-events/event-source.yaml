apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: oneuptime-webhook
  namespace: argo-events
spec:
  eventBusName: default
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    oneuptime:
      port: "12000"
      endpoint: /oneuptime
      method: POST
